[package]
name        = "protobuf-nv"
version     = "0.1.0"
description = "Protocol Buffers: the wire format as tag arithmetic over a caller's buffer, a feed-and-drain reader that keeps the fields it does not know, writers and a builder, descriptor sets read, checked and written back, a message decoded by a descriptor read at run time, and a code generator whose output builds and round-trips against Google's protobuf."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`: arithmetic over bytes the caller already holds.  No function
# declares an effect.  A descriptor set is read by the host and handed
# in as bytes, and a generated file is answered as text for the host to
# write.  `pbread.drain<S: Read[e]>` binds its cost rather than
# spending one, so it is charged whatever the caller's source costs
# (SPEC section 5.6).
#
# There is no device build.  Every varint here is leb128-nv's, whose
# surface takes `Bytes` and `Cursor`, and neither links at
# `@tier(embedded)`.  The README says so.
layer       = "core"

category    = "encoding"

tags = ["protobuf", "proto3", "wire-format", "grpc", "codegen", "descriptor", "sans-io"]
repository  = "https://github.com/novolang/protobuf-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "The wire under gRPC, and the descriptors that describe it"

[dependencies]
# leb128-nv is protocol buffers' varint unchanged: seven bits per byte,
# least significant group first, the top bit of every byte but the last
# set.  The Encoding page's varint is DWARF's LEB128.
leb128-nv = "^0.1.7"

# zigzag-nv is the `sint32` and `sint64` fold, and only those two.
# `int32` and `int64` are not folded: a negative `int32` is
# sign-extended to sixty-four bits and costs ten bytes.
zigzag-nv = "^0.1.5"

# varint-nv is the two composed, zigzag and then LEB128, which is
# `sint64` in one call.  Its own dependencies are the two above.
varint-nv = "^0.1.6"

# No JSON package.  Protobuf's JSON mapping is a separate specification,
# and the README lists it among what is not included.
